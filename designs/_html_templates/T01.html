<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #F8FAFC;
    color: #0F172A;
    width: 1440px;
    height: 900px;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
}
input, button, select, textarea { font-family: inherit; }

.wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: radial-gradient(circle at 50% 30%, #EEF2F6 0%, #E2E8F0 100%);
}
.card {
    background: #FFFFFF;
    width: 480px;
    padding: 48px 44px;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    border: 1px solid #E2E8F0;
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
}
.brand-logo {
    width: 36px;
    height: 36px;
    background: #0B57D0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    font-size: 18px;
}
.brand-name {
    font-weight: 700;
    font-size: 19px;
    color: #0F172A;
}
h1 {
    font-size: 26px;
    font-weight: 700;
    color: #0F172A;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
}
p.subtitle {
    font-size: 14px;
    color: #64748B;
    margin-bottom: 28px;
}
.form-group {
    margin-bottom: 20px;
}
label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 8px;
}
.input-box {
    position: relative;
    display: flex;
    align-items: center;
}
input[type="email"], input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #CBD5E1;
    border-radius: 10px;
    font-size: 14px;
    background: #F8FAFC;
    color: #0F172A;
    outline: none;
    transition: all 0.2s;
}
.eye-btn {
    position: absolute;
    right: 14px;
    background: none;
    border: none;
    color: #64748B;
    cursor: pointer;
    display: flex;
    align-items: center;
}
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin: 20px 0 28px 0;
}
.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #475569;
    cursor: pointer;
}
.remember input {
    accent-color: #0B57D0;
    width: 16px;
    height: 16px;
    border-radius: 4px;
}
.forgot-link {
    color: #0B57D0;
    text-decoration: none;
    font-weight: 600;
}
.btn-submit {
    width: 100%;
    padding: 13px;
    background: #0B57D0;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(11, 87, 208, 0.25);
}
.footer-text {
    text-align: center;
    font-size: 13px;
    color: #64748B;
    margin-top: 24px;
}
.footer-text a {
    color: #0B57D0;
    text-decoration: none;
    font-weight: 600;
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="brand">
            <div class="brand-logo">W</div>
            <div class="brand-name">WebGenBench</div>
        </div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Please enter your credentials to access your dashboard.</p>
        
        <div class="form-group">
            <label>Email Address</label>
            <div class="input-box">
                <input type="email" value="alex.morgan@company.com" placeholder="name@company.com">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-box">
                <input type="password" value="SuperSecretPassword123!">
                <button class="eye-btn" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
            </div>
        </div>

        <div class="options">
            <label class="remember"><input type="checkbox" checked> Remember for 30 days</label>
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button class="btn-submit" type="button">Sign In</button>

        <div class="footer-text">
            Don't have an account? <a href="#">Create account</a>
        </div>
    </div>
</div>
</body>
</html>
