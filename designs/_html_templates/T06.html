<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #F8FAFC;
    color: #0F172A;
    width: 1440px;
    height: 900px;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
}
input, button, select, textarea { font-family: inherit; }

.wrapper {
    max-width: 980px;
    margin: 40px auto;
    background: #FFFFFF;
    border-radius: 20px;
    border: 1px solid #E2E8F0;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04);
    overflow: hidden;
}
.cover-banner {
    height: 160px;
    background: linear-gradient(135deg, #0B57D0 0%, #00639B 50%, #001D35 100%);
    position: relative;
}
.profile-header {
    padding: 0 44px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: -50px;
    margin-bottom: 24px;
    position: relative;
    z-index: 2;
}
.avatar-wrap {
    display: flex;
    align-items: flex-end;
    gap: 20px;
}
.avatar-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 4px solid #FFFFFF;
    background: #3B82F6;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
    box-shadow: 0 4px 6px rgba(0,0,0,0.08);
}
.user-info h2 {
    font-size: 22px;
    font-weight: 700;
    color: #0F172A;
}
.user-info p {
    font-size: 13.5px;
    color: #64748B;
}
.btn-change-avatar {
    padding: 8px 16px;
    border: 1px solid #CBD5E1;
    background: white;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
}
.tabs-bar {
    display: flex;
    border-bottom: 1px solid #E2E8F0;
    padding: 0 44px;
    gap: 32px;
}
.tab-link {
    padding: 14px 0;
    font-size: 14px;
    font-weight: 600;
    color: #64748B;
    text-decoration: none;
    border-bottom: 2px solid transparent;
}
.tab-link.active {
    color: #0B57D0;
    border-bottom-color: #0B57D0;
}
.form-content {
    padding: 32px 44px;
}
.form-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}
.form-group {
    margin-bottom: 20px;
}
label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 8px;
}
input[type="text"], input[type="email"], select, textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    font-size: 14px;
    background: #F8FAFC;
    color: #0F172A;
    outline: none;
}
textarea {
    resize: none;
    height: 80px;
}
.actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 10px;
    padding-top: 20px;
    border-top: 1px solid #E2E8F0;
}
.btn-cancel {
    padding: 10px 20px;
    border: 1px solid #CBD5E1;
    background: white;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
}
.btn-save {
    padding: 10px 22px;
    border: none;
    background: #0B57D0;
    color: white;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(11, 87, 208, 0.25);
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="cover-banner"></div>
    <div class="profile-header">
        <div class="avatar-wrap">
            <div class="avatar-img">JD</div>
            <div class="user-info">
                <h2>Johnathan Doe</h2>
                <p>Senior AI Engineer &amp; Benchmark Lead</p>
            </div>
        </div>
        <button class="btn-change-avatar" type="button">Change Avatar</button>
    </div>

    <div class="tabs-bar">
        <a href="#" class="tab-link active">Personal Information</a>
        <a href="#" class="tab-link">Password &amp; Security</a>
        <a href="#" class="tab-link">Notifications</a>
        <a href="#" class="tab-link">API Keys &amp; Integrations</a>
    </div>

    <div class="form-content">
        <div class="form-grid-2">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" value="Johnathan">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" value="Doe">
            </div>
        </div>

        <div class="form-grid-2">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" value="johnathan.doe@benchmark-ai.org">
            </div>
            <div class="form-group">
                <label>Timezone</label>
                <select>
                    <option>(GMT+07:00) Hanoi, Bangkok, Jakarta</option>
                    <option>(GMT-08:00) Pacific Time (US & Canada)</option>
                    <option>(GMT+00:00) UTC / London</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Biography</label>
            <textarea>Evaluating LLM-based autonomous coding agents across multi-turn responsive UI generation.</textarea>
        </div>

        <div class="actions">
            <button class="btn-cancel" type="button">Cancel</button>
            <button class="btn-save" type="button">Save Changes</button>
        </div>
    </div>
</div>
</body>
</html>
