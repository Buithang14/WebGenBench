<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #F8FAFC;
    color: #0F172A;
    width: 1440px;
    height: 900px;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
}
input, button, select, textarea { font-family: inherit; }

.wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: radial-gradient(circle at 50% 30%, #EEF2F6 0%, #E2E8F0 100%);
}
.card {
    background: #FFFFFF;
    width: 520px;
    padding: 38px 42px;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    border: 1px solid #E2E8F0;
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}
.brand-logo {
    width: 32px;
    height: 32px;
    background: #0B57D0;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    font-size: 16px;
}
.brand-name {
    font-weight: 700;
    font-size: 18px;
    color: #0F172A;
}
h1 {
    font-size: 24px;
    font-weight: 700;
    color: #0F172A;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
}
p.subtitle {
    font-size: 13px;
    color: #64748B;
    margin-bottom: 22px;
}
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
}
.form-group {
    margin-bottom: 14px;
}
label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
}
.input-box {
    position: relative;
    display: flex;
    align-items: center;
}
input[type="text"], input[type="email"], input[type="password"], input[type="tel"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    font-size: 13.5px;
    background: #F8FAFC;
    color: #0F172A;
    outline: none;
}
.eye-btn {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: #64748B;
    cursor: pointer;
    display: flex;
}
.strength-bar-wrap {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.strength-bar {
    display: flex;
    gap: 4px;
    flex: 1;
}
.strength-seg {
    height: 4px;
    flex: 1;
    border-radius: 2px;
    background: #E2E8F0;
}
.strength-seg.active {
    background: #10B981;
}
.strength-text {
    font-size: 11px;
    font-weight: 600;
    color: #10B981;
}
.terms {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12.5px;
    color: #475569;
    margin: 18px 0 22px 0;
    line-height: 1.4;
}
.terms input {
    margin-top: 2px;
    accent-color: #0B57D0;
}
.terms a {
    color: #0B57D0;
    text-decoration: none;
    font-weight: 600;
}
.btn-submit {
    width: 100%;
    padding: 12px;
    background: #0B57D0;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(11, 87, 208, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.footer-text {
    text-align: center;
    font-size: 12.5px;
    color: #64748B;
    margin-top: 18px;
}
.footer-text a {
    color: #0B57D0;
    text-decoration: none;
    font-weight: 600;
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="brand">
            <div class="brand-logo">W</div>
            <div class="brand-name">WebGenBench</div>
        </div>
        <h1>Create an Account</h1>
        <p class="subtitle">Join thousands of developers benchmarking code generation.</p>
        
        <div class="form-grid">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" value="Nguyen Van An">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" value="0912 345 678">
            </div>
        </div>

        <div class="form-group">
            <label>Work Email</label>
            <input type="email" value="an.nguyen@university.edu.vn">
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-box">
                <input type="password" value="PassStrong2026!@#">
                <button class="eye-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
            </div>
            <div class="strength-bar-wrap">
                <div class="strength-bar">
                    <div class="strength-seg active"></div>
                    <div class="strength-seg active"></div>
                    <div class="strength-seg active"></div>
                    <div class="strength-seg active"></div>
                </div>
                <span class="strength-text">Strong password</span>
            </div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-box">
                <input type="password" value="PassStrong2026!@#">
                <button class="eye-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
            </div>
        </div>

        <label class="terms">
            <input type="checkbox" checked>
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
        </label>

        <button class="btn-submit" type="button">Register Account</button>

        <div class="footer-text">
            Already have an account? <a href="#">Log in</a>
        </div>
    </div>
</div>
</body>
</html>
