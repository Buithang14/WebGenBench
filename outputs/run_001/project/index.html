<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập tài khoản</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="login-title">
      <div class="brand" aria-hidden="true">
        <span class="brand-mark">W</span>
      </div>

      <header class="card-header">
        <h1 id="login-title">Đăng nhập tài khoản</h1>
        <p class="subtitle">Nhập email và mật khẩu để tiếp tục vào không gian làm việc của bạn.</p>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="ban@congty.com"
            required
            aria-describedby="email-error"
            aria-invalid="false"
          >
          <p id="email-error" class="field-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="password">Mật khẩu</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Tối thiểu 6 ký tự"
              required
              minlength="6"
              aria-describedby="password-error"
              aria-invalid="false"
            >
            <button
              type="button"
              id="toggle-password"
              class="toggle-password"
              aria-label="Hiện mật khẩu"
              aria-pressed="false"
              aria-controls="password"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a18.4 18.4 0 0 1-3.2 3.8M6.1 6.8C3.7 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.2-.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p id="password-error" class="field-error" role="alert"></p>
        </div>

        <div class="form-row">
          <label class="remember" for="remember">
            <input id="remember" name="remember" type="checkbox">
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a class="forgot" href="#quen-mat-khau">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="submit">Đăng nhập</button>
      </form>

      <div id="form-status" class="form-status" role="status" aria-live="polite"></div>

      <div id="success" class="success" hidden>
        <div class="success-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>Đăng nhập thành công</h2>
        <p id="success-message">Bạn đã đăng nhập. Chào mừng bạn quay trở lại.</p>
        <button type="button" id="back-to-form" class="submit submit-secondary">Đăng nhập tài khoản khác</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
